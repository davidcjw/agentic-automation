name: CI

on:
  push:
  pull_request:

jobs:
  shellcheck:
    name: ShellCheck (.sh + git-hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r -d '' f; do
            echo "shellcheck $f"
            shellcheck "$f" || status=1
          done < <(find . -name '*.sh' -not -path './node_modules/*' -print0)
          if [ -f git-hooks/commit-msg ]; then
            echo "shellcheck git-hooks/commit-msg"
            shellcheck git-hooks/commit-msg || status=1
          fi
          exit "$status"

  hooks-syntax:
    name: Hook syntax + tests (node --check / --test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: node --check every hook
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "node --check $f"
            node --check "$f"
          done < <(find .claude/hooks -name '*.mjs' -print0)
      - name: sh -n the commit-msg hook
        shell: bash
        run: |
          set -euo pipefail
          echo "sh -n git-hooks/commit-msg"
          sh -n git-hooks/commit-msg
      - name: Run the hook test suite
        shell: bash
        # Glob the test files explicitly — directory args to `node --test`
        # aren't supported until a newer Node than the pinned major.
        run: node --test .claude/hooks/*.test.mjs

  json-validate:
    name: JSON parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JSON.parse every *.json
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' f; do
            echo "validating $f"
            node -e 'const fs=require("fs");JSON.parse(fs.readFileSync(process.argv[1],"utf8"))' "$f"
          done < <(find . -name '*.json' -not -path './node_modules/*' -print0)
